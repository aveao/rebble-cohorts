[project]
name = "cohorts"
version = "0.1.0"
description = "The Rebble cohorts API"
readme = "README.md"
# Applies to the local tooling env only; pywrangler resolves the Worker's own
# interpreter and dependencies separately (see pylock.toml). Kept wide enough to
# accept a system interpreter — pinning it to a version the machine does not
# have makes uv download a second CPython purely to run ruff and pywrangler.
requires-python = ">=3.12"
# Worker runtime dependencies only — these get bundled into the deployed Worker,
# so keep the list short. Outbound HTTP goes through the runtime's own fetch
# (workers SDK, shipped with the runtime) rather than httpx, which falls back to
# raw TCP sockets that the Workers runtime does not provide. Local tooling
# belongs in dependency-groups below, and tools/cli.py declares its own deps
# inline (PEP 723).
dependencies = [
    "fastapi>=0.120",
]

[tool.uv]
# pywrangler requires uv >= 0.12.3.
required-version = ">=0.12.3"
exclude-newer = "3 days"
package = false

[tool.ruff]
line-length = 100
# pywrangler vendors the worker's dependencies into these on build.
extend-exclude = ["python_modules", ".venv-workers"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "workers-py>=1.16",
]
