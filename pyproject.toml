[project]
name = "cohorts"
version = "0.1.0"
description = "The Rebble cohorts API"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.35.0",
    "click>=8.1",
    "fastapi>=0.120",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "3 days"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]

[project.scripts]
cohorts = "cohorts.cli:cli"
debug_server = "serve_debug:main"
